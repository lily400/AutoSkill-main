schema_version = "1.4"
artifacts = [{source = "/work/repo", destination = "repo"}]

[metadata]
task_id = "git-restore-explicit-source-both-v1"
task_version = 1

[agent]
timeout_sec = 120

[environment]
build_timeout_sec = 600
cpus = 1
memory_mb = 1024
workdir = "/work/repo"
network_mode = "no-network"

[verifier]
environment_mode = "separate"
timeout_sec = 60

[verifier.environment]
network_mode = "no-network"
workdir = "/tests"
